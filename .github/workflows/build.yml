name: Build Flora GPT APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Flora-GPT schreiben (kompletter Transformer steckt in index.html)
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="de"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
          <meta name="theme-color" content="#07060f"><title>Flora GPT</title>
          <style>
          :root{--bg:#07060f;--g:rgba(255,255,255,.06);--b:rgba(255,255,255,.12);--v:#8b5cf6;--c:#22d3ee;--p:#f472b6;--t:#ece9ff;--m:#9b97bd}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
          html,body{height:100%;background:var(--bg);color:var(--t);font-family:system-ui,Roboto,sans-serif;overflow:hidden}
          body:before,body:after{content:"";position:fixed;width:380px;height:380px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;animation:fl 14s ease-in-out infinite alternate}
          body:before{background:var(--v);top:-120px;left:-100px}body:after{background:var(--c);bottom:-140px;right:-120px;animation-delay:-7s}
          @keyframes fl{to{transform:translate(60px,50px) scale(1.2)}}
          #app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
          header{display:flex;align-items:center;gap:12px;padding:14px 18px}
          .orb{width:42px;height:42px;border-radius:50%;background:conic-gradient(from 0deg,var(--v),var(--c),var(--p),var(--v));animation:sp 5s linear infinite;box-shadow:0 0 24px var(--v);position:relative}
          .orb:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
          .orb.think{animation-duration:.9s;box-shadow:0 0 34px var(--c)}
          @keyframes sp{to{transform:rotate(360deg)}}
          h1{font-size:22px;letter-spacing:5px;background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;color:transparent}
          header small{color:var(--m);font-size:12px}
          main{flex:1;min-height:0;position:relative}
          .tab{position:absolute;inset:0;display:none;flex-direction:column;padding:0 14px 8px;overflow-y:auto}
          .tab.on{display:flex}
          .card{background:var(--g);border:1px solid var(--b);backdrop-filter:blur(14px);border-radius:20px;padding:14px;margin-bottom:12px}
          #log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 10px}
          .msg{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.4;font-size:15px;white-space:pre-wrap;animation:in .25s;word-break:break-word}
          @keyframes in{from{opacity:0;transform:translateY(8px)}}
          .me{align-self:flex-end;background:linear-gradient(135deg,var(--v),#6d28d9);border-bottom-right-radius:5px}
          .fl{align-self:flex-start;background:var(--g);border:1px solid var(--b);border-bottom-left-radius:5px}
          .meta{display:block;font-size:11px;color:var(--m);margin-top:6px}
          .bar{display:flex;gap:8px;padding:6px 0}
          input,textarea,select{flex:1;background:var(--g);border:1px solid var(--b);color:var(--t);border-radius:16px;padding:12px 14px;font-size:15px;outline:none;width:100%;font-family:inherit}
          select option{background:#1c1a33}
          input:focus,textarea:focus{border-color:var(--c);box-shadow:0 0 14px rgba(34,211,238,.3)}
          textarea{min-height:110px;resize:none;margin-bottom:10px}
          button{border:0;color:#fff;font-weight:600;font-size:15px;border-radius:16px;padding:13px 18px;background:linear-gradient(135deg,var(--v),var(--p));box-shadow:0 6px 20px rgba(139,92,246,.4)}
          button:active{transform:scale(.96)}button:disabled{opacity:.5}
          button.alt{background:var(--g);border:1px solid var(--b);box-shadow:none}
          .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1}
          label.f{display:block;font-size:12px;color:var(--m);margin:6px 0 4px}
          h3{font-size:14px;color:var(--c);margin-bottom:8px;letter-spacing:1px}
          p.h{color:var(--m);font-size:13px;line-height:1.45;margin-bottom:10px}
          .pr{height:8px;border-radius:8px;background:var(--g);overflow:hidden;margin:8px 0}
          .pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--p));transition:width .1s}
          .st{font-size:12px;color:var(--m);line-height:1.5}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .stat{text-align:center}.stat b{display:block;font-size:22px;background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;color:transparent}
          .stat small{color:var(--m);font-size:12px}
          canvas{width:100%;height:110px;display:block;border-radius:12px;background:rgba(0,0,0,.25)}
          nav{display:flex;margin:6px 10px calc(10px + env(safe-area-inset-bottom));background:var(--g);border:1px solid var(--b);backdrop-filter:blur(16px);border-radius:24px;padding:5px}
          nav div{flex:1;text-align:center;padding:8px 0;border-radius:18px;font-size:11px;color:var(--m)}
          nav div span{display:block;font-size:19px}
          nav div.on{background:linear-gradient(135deg,rgba(139,92,246,.45),rgba(244,114,182,.3));color:#fff}
          #boot{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
          #boot .orb{width:90px;height:90px;margin-bottom:24px}#boot .orb:after{inset:9px}
          #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1c1a33;border:1px solid var(--b);padding:10px 16px;border-radius:14px;font-size:13px;z-index:10;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
          #toast.on{opacity:1}
          </style></head><body>
          <div id="boot"><div class="orb think"></div><h1>FLORA</h1><p class="st" id="bt" style="margin-top:14px">Starte…</p></div>
          <div id="app">
           <header><div class="orb" id="orb"></div><div><h1>FLORA GPT</h1><small id="sub"></small></div></header>
           <main>
            <section class="tab on" id="t-chat"><div id="log"></div>
             <div class="bar"><input id="in" placeholder="Schreib Flora…" autocomplete="off"><button id="send">➤</button></div></section>
            <section class="tab" id="t-data">
             <div class="card"><h3>TRAININGSDATEN</h3>
              <p class="h"><b>Normaler Text</b> (Bücher, Artikel, Notizen) bringt Flora Sprache und Wissen bei. Zeilen im Format <b>Frage =&gt; Antwort</b> bringen ihr das Chatten bei. Beides kannst du mischen.</p>
              <div class="row"><button id="up">📄 Dateien wählen</button><button class="alt" id="sm">Beispieldaten</button></div>
              <input type="file" id="fi" accept=".txt,.md,.csv,.json,.jsonl,.html,text/*" multiple style="display:none">
              <textarea id="kx" placeholder="Oder Text hier einfügen…"></textarea>
              <button class="alt" id="ka" style="width:100%">Text hinzufügen</button>
              <div class="pr"><i id="kp"></i></div><div class="st" id="ks">Bereit.</div></div>
             <div class="card"><h3>VORHANDENE DATEN</h3><div class="grid" id="dstats"></div>
              <button class="alt" id="dc" style="width:100%;margin-top:10px">Alle Daten löschen</button></div></section>
            <section class="tab" id="t-train">
             <div class="card"><h3>TRAINING</h3>
              <div class="row"><div><label class="f">Ziel-Schritte</label><input id="st" type="number" value="2000"></div><div><label class="f">Batch</label><input id="bs" type="number" value="4"></div><div><label class="f">Lernrate</label><input id="lr" type="number" step="0.0005" value="0.003"></div></div>
              <button id="go" style="width:100%">▶ Training starten</button>
              <canvas id="ch" width="600" height="220"></canvas>
              <div class="st" id="ts" style="margin-top:8px">Noch nicht trainiert.</div>
              <button class="alt" id="pb" style="width:100%;margin-top:10px">Probetext schreiben</button>
              <div class="st" id="pt" style="margin-top:8px;white-space:pre-wrap"></div></div></section>
            <section class="tab" id="t-model">
             <div class="card"><h3>MODELL</h3><div class="grid" id="mstats"></div></div>
             <div class="card"><h3>NEUES MODELL</h3>
              <select id="ps"><option value="klein">Klein · 120 Tsd. Parameter (schnell)</option><option value="mittel">Mittel · 840 Tsd. Parameter</option><option value="gross">Groß · 2,7 Mio. Parameter (sehr langsam)</option></select>
              <button class="alt" id="nm" style="width:100%;margin-top:8px">Neu erstellen (löscht das aktuelle)</button></div>
             <div class="card"><h3>AUSGABE</h3>
              <div class="row"><div><label class="f">Temperatur</label><input id="tp" type="number" step="0.1" value="0.7"></div><div><label class="f">Top-k</label><input id="tk" type="number" value="20"></div></div></div>
             <div class="card"><div class="row"><button id="dl">⬇ Modell herunterladen</button><button class="alt" id="imp">⬆ Importieren</button></div>
              <input type="file" id="fm" accept=".json,application/json" style="display:none">
              <p class="h">Die Datei enthält alle Gewichte. Mit dem Skript train_flora.py kannst du sie am PC mit einer Grafikkarte weitertrainieren und wieder importieren.</p></div></section>
           </main>
           <nav><div class="on" data-t="chat"><span>💬</span>Chat</div><div data-t="data"><span>📚</span>Daten</div><div data-t="train"><span>🏋️</span>Training</div><div data-t="model"><span>📦</span>Modell</div></nav>
          </div><div id="toast"></div>
          <script>
          /* ===== Flora-GPT: Transformer (decoder-only) mit eigener Backpropagation ===== */
          const f32=n=>new Float32Array(n);
          const PRESETS={klein:{V:256,d:64,L:2,H:4,T:96},mittel:{V:256,d:128,L:4,H:4,T:128},gross:{V:256,d:192,L:6,H:6,T:128}};
          function layout(c){const o={};let p=0;const add=(n,s)=>{o[n]=p;p+=s},d=c.d;
           add('tok',c.V*d);add('pos',c.T*d);
           for(let l=0;l<c.L;l++){add('ln1g'+l,d);add('ln1b'+l,d);add('wq'+l,d*d);add('wk'+l,d*d);add('wv'+l,d*d);add('wo'+l,d*d);add('ln2g'+l,d);add('ln2b'+l,d);add('w1'+l,4*d*d);add('w2'+l,4*d*d)}
           add('lnfg',d);add('lnfb',d);o.N=p;return o}
          function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
          function newModel(cfg){
           const o=layout(cfg),N=o.N,P=f32(N),d=cfg.d;
           const rnd=(off,len,s)=>{for(let i=0;i<len;i++)P[off+i]=randn()*s};
           rnd(o.tok,cfg.V*d,.02);rnd(o.pos,cfg.T*d,.02);
           const rs=.02/Math.sqrt(2*cfg.L);
           for(let l=0;l<cfg.L;l++){
            for(let j=0;j<d;j++){P[o['ln1g'+l]+j]=1;P[o['ln2g'+l]+j]=1}
            rnd(o['wq'+l],d*d,.02);rnd(o['wk'+l],d*d,.02);rnd(o['wv'+l],d*d,.02);rnd(o['wo'+l],d*d,rs);
            rnd(o['w1'+l],4*d*d,.02);rnd(o['w2'+l],4*d*d,rs);
           }
           for(let j=0;j<d;j++)P[o.lnfg+j]=1;
           return wrap(cfg,P,0);
          }
          function wrap(cfg,P,step){
           const o=layout(cfg),N=o.N,mask=new Uint8Array(N);
           for(let l=0;l<cfg.L;l++)for(const n of ['wq','wk','wv','wo','w1','w2'])mask.fill(1,o[n+l],o[n+l]+(n==='w1'||n==='w2'?4:1)*cfg.d*cfg.d);
           return{cfg,o,P,G:f32(N),m:f32(N),v:f32(N),mask,step,hist:[],ws:null};
          }
          function mkWS(c){
           const n=c.T,d=c.d,L=c.L,V=c.V,H=c.H,A=(k)=>Array.from({length:L},()=>f32(k));
           return{x:Array.from({length:L+1},()=>f32(n*d)),xm:A(n*d),a:A(n*d),q:A(n*d),k:A(n*d),v:A(n*d),att:A(H*n*n),o:A(n*d),b:A(n*d),u:A(4*d*n),g:A(4*d*n),
            mu1:A(n),rs1:A(n),mu2:A(n),rs2:A(n),f:f32(n*d),muf:f32(n),rsf:f32(n),lg:f32(n*V),
            dX:Array.from({length:L+1},()=>f32(n*d)),dG:f32(4*d*n),dU:f32(4*d*n),dB:f32(n*d),dxm:f32(n*d),dO:f32(n*d),dq:f32(n*d),dk:f32(n*d),dv:f32(n*d),dA:f32(n*d),dF:f32(n*d)};
          }
          function mm(C,A,B,bo,n,k,m){C.fill(0,0,n*m);for(let i=0;i<n;i++){const ci=i*m,ai=i*k;for(let j=0;j<k;j++){const a=A[ai+j];if(a===0)continue;const bj=bo+j*m;for(let p=0;p<m;p++)C[ci+p]+=a*B[bj+p]}}}
          function mmNT(C,A,B,bo,n,k,m){for(let i=0;i<n;i++){const ai=i*k;for(let p=0;p<m;p++){const bp=bo+p*k;let s=0;for(let j=0;j<k;j++)s+=A[ai+j]*B[bp+j];C[i*m+p]=s}}}
          function mmBT(dA,dC,B,bo,n,m,k){for(let i=0;i<n;i++){const ci=i*m;for(let j=0;j<k;j++){const bj=bo+j*m;let s=0;for(let p=0;p<m;p++)s+=dC[ci+p]*B[bj+p];dA[i*k+j]+=s}}}
          function mmAT(G,go,A,C,n,k,m){for(let i=0;i<n;i++){const ci=i*m;for(let j=0;j<k;j++){const a=A[i*k+j];if(a===0)continue;const gj=go+j*m;for(let p=0;p<m;p++)G[gj+p]+=a*C[ci+p]}}}
          function lnF(y,x,P,go,bo,n,d,mu,rs){for(let t=0;t<n;t++){const b=t*d;let m=0;for(let j=0;j<d;j++)m+=x[b+j];m/=d;let v=0;for(let j=0;j<d;j++){const e=x[b+j]-m;v+=e*e}v/=d;const r=1/Math.sqrt(v+1e-5);mu[t]=m;rs[t]=r;for(let j=0;j<d;j++)y[b+j]=(x[b+j]-m)*r*P[go+j]+P[bo+j]}}
          function lnB(dx,dy,x,mu,rs,P,go,G,bo,n,d){for(let t=0;t<n;t++){const b=t*d;let s1=0,s2=0;for(let j=0;j<d;j++){const xh=(x[b+j]-mu[t])*rs[t],dxh=dy[b+j]*P[go+j];s1+=dxh;s2+=dxh*xh;G[go+j]+=dy[b+j]*xh;G[bo+j]+=dy[b+j]}
           for(let j=0;j<d;j++){const xh=(x[b+j]-mu[t])*rs[t],dxh=dy[b+j]*P[go+j];dx[b+j]+=rs[t]*(dxh-s1/d-xh*s2/d)}}}
          const GC=Math.sqrt(2/Math.PI);
          const gelu=u=>.5*u*(1+Math.tanh(GC*(u+.044715*u*u*u)));
          const dgelu=u=>{const t=Math.tanh(GC*(u+.044715*u*u*u));return .5*(1+t)+.5*u*(1-t*t)*GC*(1+3*.044715*u*u)};

          /* Vorwärts (+ optional Rückwärts). ids: n+1 Bytes. Gibt den mittleren Verlust zurück. */
          function fwdbwd(M,ids,n,back,scale){
           const c=M.cfg,o=M.o,P=M.P,G=M.G,d=c.d,L=c.L,H=c.H,V=c.V,dh=d/H,sc=1/Math.sqrt(dh),d4=4*d;
           if(!M.ws)M.ws=mkWS(c);const w=M.ws;
           for(let t=0;t<n;t++){const a=o.tok+ids[t]*d,b=o.pos+t*d,x=w.x[0];for(let j=0;j<d;j++)x[t*d+j]=P[a+j]+P[b+j]}
           for(let l=0;l<L;l++){
            const xi=w.x[l],xm=w.xm[l],xo=w.x[l+1],A=w.a[l],q=w.q[l],K=w.k[l],Vv=w.v[l],AT=w.att[l],O=w.o[l],B=w.b[l],U=w.u[l],Gg=w.g[l];
            lnF(A,xi,P,o['ln1g'+l],o['ln1b'+l],n,d,w.mu1[l],w.rs1[l]);
            mm(q,A,P,o['wq'+l],n,d,d);mm(K,A,P,o['wk'+l],n,d,d);mm(Vv,A,P,o['wv'+l],n,d,d);
            for(let h=0;h<H;h++)for(let t=0;t<n;t++){
             const qo=t*d+h*dh,ab=(h*n+t)*n;let mx=-1e30;
             for(let s=0;s<=t;s++){const ko=s*d+h*dh;let dot=0;for(let j=0;j<dh;j++)dot+=q[qo+j]*K[ko+j];dot*=sc;AT[ab+s]=dot;if(dot>mx)mx=dot}
             let z=0;for(let s=0;s<=t;s++){const e=Math.exp(AT[ab+s]-mx);AT[ab+s]=e;z+=e}
             for(let j=0;j<dh;j++)O[qo+j]=0;
             for(let s=0;s<=t;s++){const p=AT[ab+s]/z;AT[ab+s]=p;const vo=s*d+h*dh;for(let j=0;j<dh;j++)O[qo+j]+=p*Vv[vo+j]}
            }
            mm(xm,O,P,o['wo'+l],n,d,d);for(let i=0;i<n*d;i++)xm[i]+=xi[i];
            lnF(B,xm,P,o['ln2g'+l],o['ln2b'+l],n,d,w.mu2[l],w.rs2[l]);
            mm(U,B,P,o['w1'+l],n,d,d4);for(let i=0;i<n*d4;i++)Gg[i]=gelu(U[i]);
            mm(xo,Gg,P,o['w2'+l],n,d4,d);for(let i=0;i<n*d;i++)xo[i]+=xm[i];
           }
           lnF(w.f,w.x[L],P,o.lnfg,o.lnfb,n,d,w.muf,w.rsf);
           mmNT(w.lg,w.f,P,o.tok,n,d,V);
           let loss=0;const lg=w.lg;
           for(let t=0;t<n;t++){
            const r=t*V,y=ids[t+1];let mx=-1e30;for(let v=0;v<V;v++)if(lg[r+v]>mx)mx=lg[r+v];
            let z=0;for(let v=0;v<V;v++){const e=Math.exp(lg[r+v]-mx);lg[r+v]=e;z+=e}
            loss-=Math.log(lg[r+y]/z+1e-12);
            for(let v=0;v<V;v++)lg[r+v]=(lg[r+v]/z)*scale/n;lg[r+y]-=scale/n;
           }
           loss/=n;if(!back)return loss;
           /* ----- Rückwärts ----- */
           mm(w.dF,lg,P,o.tok,n,V,d);mmAT(G,o.tok,lg,w.f,n,V,d);
           w.dX[L].fill(0);lnB(w.dX[L],w.dF,w.x[L],w.muf,w.rsf,P,o.lnfg,G,o.lnfb,n,d);
           for(let l=L-1;l>=0;l--){
            const dxo=w.dX[l+1],dxi=w.dX[l],xi=w.x[l],xm=w.xm[l],A=w.a[l],q=w.q[l],K=w.k[l],Vv=w.v[l],AT=w.att[l],O=w.o[l],B=w.b[l],U=w.u[l],Gg=w.g[l];
            w.dG.fill(0,0,n*d4);mmBT(w.dG,dxo,P,o['w2'+l],n,d,d4);mmAT(G,o['w2'+l],Gg,dxo,n,d4,d);
            for(let i=0;i<n*d4;i++)w.dU[i]=w.dG[i]*dgelu(U[i]);
            w.dB.fill(0,0,n*d);mmBT(w.dB,w.dU,P,o['w1'+l],n,d4,d);mmAT(G,o['w1'+l],B,w.dU,n,d,d4);
            w.dxm.set(dxo.subarray(0,n*d));lnB(w.dxm,w.dB,xm,w.mu2[l],w.rs2[l],P,o['ln2g'+l],G,o['ln2b'+l],n,d);
            w.dO.fill(0,0,n*d);mmBT(w.dO,w.dxm,P,o['wo'+l],n,d,d);mmAT(G,o['wo'+l],O,w.dxm,n,d,d);
            w.dq.fill(0,0,n*d);w.dk.fill(0,0,n*d);w.dv.fill(0,0,n*d);
            for(let h=0;h<H;h++)for(let t=0;t<n;t++){
             const qo=t*d+h*dh,ab=(h*n+t)*n;let dot=0;const da=new Float32Array(t+1);
             for(let s=0;s<=t;s++){const vo=s*d+h*dh;let x=0;for(let j=0;j<dh;j++)x+=w.dO[qo+j]*Vv[vo+j];da[s]=x;dot+=AT[ab+s]*x;for(let j=0;j<dh;j++)w.dv[vo+j]+=AT[ab+s]*w.dO[qo+j]}
             for(let s=0;s<=t;s++){const ds=AT[ab+s]*(da[s]-dot)*sc,ko=s*d+h*dh;for(let j=0;j<dh;j++){w.dq[qo+j]+=ds*K[ko+j];w.dk[ko+j]+=ds*q[qo+j]}}
            }
            w.dA.fill(0,0,n*d);
            mmBT(w.dA,w.dq,P,o['wq'+l],n,d,d);mmAT(G,o['wq'+l],A,w.dq,n,d,d);
            mmBT(w.dA,w.dk,P,o['wk'+l],n,d,d);mmAT(G,o['wk'+l],A,w.dk,n,d,d);
            mmBT(w.dA,w.dv,P,o['wv'+l],n,d,d);mmAT(G,o['wv'+l],A,w.dv,n,d,d);
            dxi.set(w.dxm.subarray(0,n*d));lnB(dxi,w.dA,xi,w.mu1[l],w.rs1[l],P,o['ln1g'+l],G,o['ln1b'+l],n,d);
           }
           const dx=w.dX[0];
           for(let t=0;t<n;t++){const a=o.tok+ids[t]*d,b=o.pos+t*d;for(let j=0;j<d;j++){G[a+j]+=dx[t*d+j];G[b+j]+=dx[t*d+j]}}
           return loss;
          }
          function adamStep(M,lr,wd,clip){
           const N=M.P.length,P=M.P,G=M.G,m=M.m,v=M.v,mask=M.mask;let g2=0;
           for(let i=0;i<N;i++)g2+=G[i]*G[i];
           const gn=Math.sqrt(g2),cs=gn>clip?clip/gn:1;M.step++;
           const b1=.9,b2=.95,c1=1-Math.pow(b1,M.step),c2=1-Math.pow(b2,M.step);
           for(let i=0;i<N;i++){const g=G[i]*cs;m[i]=b1*m[i]+(1-b1)*g;v[i]=b2*v[i]+(1-b2)*g*g;P[i]-=lr*((m[i]/c1)/(Math.sqrt(v[i]/c2)+1e-8)+(mask[i]?wd*P[i]:0));G[i]=0}
           return gn;
          }
          /* ===== Textgenerierung mit KV-Cache ===== */
          function mkCache(M){const c=M.cfg;return{k:Array.from({length:c.L},()=>f32(c.T*c.d)),v:Array.from({length:c.L},()=>f32(c.T*c.d)),pos:0,x:f32(c.d),a:f32(c.d),q:f32(c.d),o:f32(c.d),b:f32(c.d),u:f32(4*c.d),t:f32(c.d),lg:f32(c.V),sc:f32(c.T)}}
          function stepTok(M,C,id){
           const c=M.cfg,o=M.o,P=M.P,d=c.d,H=c.H,dh=d/H,sc=1/Math.sqrt(dh),pos=C.pos,x=C.x,d4=4*d;
           for(let j=0;j<d;j++)x[j]=P[o.tok+id*d+j]+P[o.pos+pos*d+j];
           const ln=(y,xx,g,b)=>{let m=0;for(let j=0;j<d;j++)m+=xx[j];m/=d;let v=0;for(let j=0;j<d;j++){const e=xx[j]-m;v+=e*e}const r=1/Math.sqrt(v/d+1e-5);for(let j=0;j<d;j++)y[j]=(xx[j]-m)*r*P[g+j]+P[b+j]};
           for(let l=0;l<c.L;l++){
            ln(C.a,x,o['ln1g'+l],o['ln1b'+l]);
            mm(C.q,C.a,P,o['wq'+l],1,d,d);mm(C.t,C.a,P,o['wk'+l],1,d,d);C.k[l].set(C.t,pos*d);mm(C.t,C.a,P,o['wv'+l],1,d,d);C.v[l].set(C.t,pos*d);
            const K=C.k[l],Vv=C.v[l];
            for(let h=0;h<H;h++){
             let mx=-1e30;for(let s=0;s<=pos;s++){let dot=0;for(let j=0;j<dh;j++)dot+=C.q[h*dh+j]*K[s*d+h*dh+j];dot*=sc;C.sc[s]=dot;if(dot>mx)mx=dot}
             let z=0;for(let s=0;s<=pos;s++){C.sc[s]=Math.exp(C.sc[s]-mx);z+=C.sc[s]}
             for(let j=0;j<dh;j++){let s2=0;for(let s=0;s<=pos;s++)s2+=C.sc[s]*Vv[s*d+h*dh+j];C.o[h*dh+j]=s2/z}
            }
            mm(C.t,C.o,P,o['wo'+l],1,d,d);for(let j=0;j<d;j++)x[j]+=C.t[j];
            ln(C.b,x,o['ln2g'+l],o['ln2b'+l]);
            mm(C.u,C.b,P,o['w1'+l],1,d,d4);for(let i=0;i<d4;i++)C.u[i]=gelu(C.u[i]);
            mm(C.t,C.u,P,o['w2'+l],1,d4,d);for(let j=0;j<d;j++)x[j]+=C.t[j];
           }
           ln(C.a,x,o.lnfg,o.lnfb);mmNT(C.lg,C.a,P,o.tok,1,d,c.V);C.pos++;return C.lg;
          }
          function sample(lg,temp,topk,recent){
           const V=lg.length,idx=Array.from({length:V},(_,i)=>i);
           const l=Array.from(lg);for(const r of recent)if(r>3)l[r]-=.3;
           idx.sort((a,b)=>l[b]-l[a]);const k=Math.min(topk,V);
           if(temp<=0.01)return idx[0];
           let mx=l[idx[0]],z=0;const p=[];for(let i=0;i<k;i++){const e=Math.exp((l[idx[i]]-mx)/temp);p.push(e);z+=e}
           let r=Math.random()*z;for(let i=0;i<k;i++){r-=p[i];if(r<=0)return idx[i]}return idx[0];
          }
          async function generate(M,prompt,opt,onTok,yieldFn){
           const T=M.cfg.T;let ctx=Array.from(prompt).slice(-(T-40)),C=mkCache(M),out=[];
           const feed=a=>{C=mkCache(M);let lg=null;for(const t of a)lg=stepTok(M,C,t);return lg};
           let lg=feed(ctx);
           for(let i=0;i<opt.max;i++){
            const id=sample(lg,opt.temp,opt.topk,ctx.slice(-24));
            if(id===3)break;ctx.push(id);out.push(id);onTok&&onTok(id);
            if(C.pos>=T)lg=feed(ctx.slice(-(T>>1)));else lg=stepTok(M,C,id);
            if(yieldFn&&i%4===3)await yieldFn();
           }
           return out;
          }
          /* ===== Speichern / Laden ===== */
          function b64(f){const u=new Uint8Array(f.buffer,f.byteOffset,f.byteLength);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
          function unb64(s){const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return new Float32Array(u.buffer)}
          function exportModel(M){return JSON.stringify({format:'flora-gpt-1',cfg:M.cfg,step:M.step,w:b64(M.P)})}
          function importModel(txt){const j=JSON.parse(txt);if(j.format!=='flora-gpt-1')throw new Error('Format');const P=unb64(j.w);if(P.length!==layout(j.cfg).N)throw new Error('Größe');return wrap(j.cfg,P,j.step||0)}
          /* ===== App ===== */
          const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
          const yieldUI=()=>new Promise(r=>setTimeout(r,0));
          const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)};
          let M=null,DS={corpus:new Uint8Array(0),chat:new Uint8Array(0),starts:new Int32Array(0)},training=false,busy=false,conv=[];
          const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('flora_gpt',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
          async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
          async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error)})}
          async function saveModel(){try{await idbSet('gpt',{cfg:M.cfg,P:M.P,m:M.m,v:M.v,step:M.step,hist:M.hist})}catch(e){toast('Speichern fehlgeschlagen')}}
          async function saveData(){try{await idbSet('data',DS)}catch(e){toast('Daten konnten nicht gespeichert werden')}}
          function restore(o){const m=wrap(o.cfg,o.P,o.step);m.m=o.m;m.v=o.v;m.hist=o.hist||[];return m}
          const nParams=c=>layout(c).N;
          const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+' Mio.':n>=1e3?(n/1e3).toFixed(0)+' Tsd.':String(n);
          const kb=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':(n/1024).toFixed(0)+' KB';

          const SAMPLE=`Hallo => Hallo! Ich bin Flora. Wie kann ich helfen?
          Hi => Hi! Schön, dass du da bist.
          Guten Morgen => Guten Morgen! Ich wünsche dir einen schönen Tag.
          Wie geht es dir => Mir geht es gut, danke. Und dir?
          Wer bist du => Ich bin Flora, ein kleines Sprachmodell, das auf deinem Handy trainiert wurde.
          Wie heißt du => Ich heiße Flora.
          Was kannst du => Ich kann Fragen beantworten und Texte schreiben, soweit ich es gelernt habe.
          Wie funktionierst du => Ich bin ein Transformer und sage Byte für Byte voraus, was als Nächstes kommt.
          Was ist ein Transformer => Ein Transformer ist ein neuronales Netz, das mit Attention erkennt, welche Teile eines Textes zusammengehören.
          Was ist eine KI => Eine KI ist ein Programm, das aus Beispielen lernt.
          Was ist ein neuronales Netz => Ein neuronales Netz besteht aus vielen verbundenen Rechenknoten, deren Gewichte beim Training angepasst werden.
          Danke => Gern geschehen!
          Tschüss => Tschüss! Bis bald.
          Was ist die Hauptstadt von Deutschland => Die Hauptstadt von Deutschland ist Berlin.
          Was ist die Hauptstadt von Frankreich => Die Hauptstadt von Frankreich ist Paris.
          Was ist die Hauptstadt von Italien => Die Hauptstadt von Italien ist Rom.
          Was ist die Hauptstadt von Österreich => Die Hauptstadt von Österreich ist Wien.
          Was ist die Hauptstadt von Spanien => Die Hauptstadt von Spanien ist Madrid.
          Was ist die Hauptstadt von der Schweiz => Die Hauptstadt der Schweiz ist Bern.
          Wie viele Tage hat eine Woche => Eine Woche hat sieben Tage.
          Wie viele Monate hat ein Jahr => Ein Jahr hat zwölf Monate.
          Wie viele Beine hat eine Spinne => Eine Spinne hat acht Beine.
          Wie viele Knochen hat ein Mensch => Ein erwachsener Mensch hat 206 Knochen.
          Woraus besteht Wasser => Wasser besteht aus Wasserstoff und Sauerstoff.
          Wie heißt der größte Planet => Der größte Planet unseres Sonnensystems ist Jupiter.
          Welche Farbe hat der Himmel => Der Himmel ist tagsüber blau.
          Wann fiel die Berliner Mauer => Die Berliner Mauer fiel am 9. November 1989.
          Wer schrieb Faust => Johann Wolfgang von Goethe schrieb Faust.
          Wer entdeckte das Penicillin => Alexander Fleming entdeckte 1928 das Penicillin.
          Was ist 2 plus 2 => 2 plus 2 ist 4.
          Was ist 10 minus 3 => 10 minus 3 ist 7.
          Flora ist ein kleines Sprachmodell, das komplett auf dem Handy läuft.
          Ein Sprachmodell sagt voraus, welches Zeichen mit der größten Wahrscheinlichkeit als nächstes kommt.
          Die Sonne ist ein Stern und liefert der Erde Licht und Wärme.
          Berlin ist die Hauptstadt von Deutschland und liegt an der Spree.`;

          /* ---------- Daten ---------- */
          function parseInto(text,P){
           for(const line of text.split(/\r?\n/)){
            const s=line.trim();if(!s)continue;const i=s.indexOf('=>');
            if(i>0){const q=s.slice(0,i).trim(),a=s.slice(i+2).trim();
             if(q&&a){const b=new Uint8Array([1,...enc.encode(q),2,...enc.encode(a),3]);P.starts.push(P.cl);P.chat.push(b);P.cl+=b.length;continue}}
            P.corpus.push(enc.encode(s+'\n'));
           }
          }
          const cat=(a,extra)=>{const n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n+extra.length);o.set(extra,0);let p=extra.length;for(const x of a){o.set(x,p);p+=x.length}return o};
          function mergeData(P){
           DS={corpus:cat(P.corpus,DS.corpus),chat:cat(P.chat,DS.chat),starts:Int32Array.from([...DS.starts,...P.starts.map(x=>x+DS.chat.length)])};
          }
          async function addTexts(items){
           if(busy||training)return;busy=true;
           const P={corpus:[],chat:[],starts:[],cl:0};
           for(let i=0;i<items.length;i++){
            $('#ks').textContent='Lese '+items[i].name+' ('+(i+1)+'/'+items.length+')';$('#kp').style.width=(i/items.length*100)+'%';await yieldUI();
            parseInto(items[i].text,P);
           }
           mergeData(P);$('#kp').style.width='100%';$('#ks').textContent='Speichere…';await yieldUI();await saveData();
           busy=false;$('#ks').textContent='Fertig.';dstats();toast('Daten hinzugefügt ✓');
          }
          function dstats(){
           const it=[[kb(DS.corpus.length),'Fließtext'],[DS.starts.length,'Frage-Antwort-Paare'],[kb(DS.chat.length),'Chat-Daten'],[fmt(DS.corpus.length+DS.chat.length),'Bytes (Tokens)']];
           $('#dstats').innerHTML=it.map(i=>'<div class="card stat" style="margin:0"><b>'+i[0]+'</b><small>'+i[1]+'</small></div>').join('');
          }
          $('#up').onclick=()=>$('#fi').click();
          $('#fi').onchange=async e=>{
           const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
           const items=[];for(const f of fs){if(/\.(pdf|docx?|pptx?|xlsx?)$/i.test(f.name)){toast(f.name+': bitte als .txt speichern');continue}items.push({name:f.name,text:await f.text()})}
           if(items.length)await addTexts(items);
          };
          $('#ka').onclick=async()=>{const t=$('#kx').value.trim();if(!t)return;await addTexts([{name:'Eingefügter Text',text:t}]);$('#kx').value=''};
          $('#sm').onclick=()=>addTexts([{name:'Beispieldaten',text:SAMPLE}]);
          $('#dc').onclick=async()=>{if(training||!confirm('Alle Trainingsdaten löschen? Das Modell bleibt erhalten.'))return;DS={corpus:new Uint8Array(0),chat:new Uint8Array(0),starts:new Int32Array(0)};await saveData();dstats()};

          /* ---------- Training ---------- */
          function batchSeq(T){
           const hasC=DS.corpus.length>0,hasP=DS.starts.length>0,useChat=hasP&&(!hasC||Math.random()<.5);
           let src,st;
           if(useChat){src=DS.chat;st=DS.starts[(Math.random()*DS.starts.length)|0]}else{src=DS.corpus;st=(Math.random()*Math.max(1,src.length-T-1))|0}
           if(st+T+1>src.length)st=Math.max(0,src.length-T-1);
           const a=src.subarray(st,st+T+1);
           if(a.length<T+1){const p=new Uint8Array(T+1).fill(10);p.set(a);return p}
           return a;
          }
          function chart(){
           const c=$('#ch'),g=c.getContext('2d'),h=M.hist,W=c.width,H=c.height;g.clearRect(0,0,W,H);if(h.length<2)return;
           const mx=Math.max(...h),mn=Math.min(...h),n=h.length;
           g.strokeStyle='#22d3ee';g.lineWidth=3;g.beginPath();
           for(let i=0;i<n;i++){const x=i/(n-1)*(W-10)+5,y=H-8-(h[i]-mn)/((mx-mn)||1)*(H-16);i?g.lineTo(x,y):g.moveTo(x,y)}
           g.stroke();
          }
          async function trainLoop(){
           if(training){training=false;return}
           if(!DS.corpus.length&&!DS.starts.length){toast('Füge erst Daten im Tab Daten hinzu');return}
           if(busy)return;
           const B=Math.max(1,+$('#bs').value||4),base=+$('#lr').value||.003,total=Math.max(1,+$('#st').value||2000),T=M.cfg.T;
           training=true;busy=true;$('#go').textContent='⏹ Stopp';$('#orb').classList.add('think');
           let t0=performance.now(),tok=0,ema=M.hist.length?M.hist[M.hist.length-1]:null,lastSave=performance.now(),lastUI=0;
           while(training&&M.step<total){
            let l=0,ok=true;
            for(let b=0;b<B;b++){
             l+=fwdbwd(M,batchSeq(T),T,true,1/B);tok+=T;await yieldUI();
             if(!training){ok=false;break}
            }
            if(!ok){M.G.fill(0);break}
            const s=M.step,lr=base*Math.min(1,(s+1)/50)*(.1+.9*.5*(1+Math.cos(Math.PI*Math.min(1,s/total))));
            adamStep(M,lr,.01,1);l/=B;ema=ema==null?l:ema*.95+.05*l;
            M.hist.push(+ema.toFixed(3));if(M.hist.length>600){M.hist=M.hist.filter((_,i)=>i%2===0)}
            const now=performance.now();
            if(now-lastUI>400){
             lastUI=now;const tps=tok/((now-t0)/1000),eta=(total-M.step)*B*T/tps;
             $('#ts').textContent='Schritt '+M.step+' / '+total+' · Verlust '+ema.toFixed(3)+' (≈ '+Math.exp(ema).toFixed(1)+' Möglichkeiten pro Zeichen) · '+Math.round(tps)+' Token/s · noch ca. '+(eta>3600?(eta/3600).toFixed(1)+' h':Math.ceil(eta/60)+' min');
             chart();head();
            }
            if(now-lastSave>60000){await saveModel();lastSave=performance.now()}
           }
           training=false;busy=false;$('#go').textContent='▶ Training starten';$('#orb').classList.remove('think');
           await saveModel();chart();head();mstats();
           $('#ts').textContent+=M.step>=total?' · Ziel erreicht ✓':' · gestoppt, gespeichert ✓';
          }
          $('#go').onclick=trainLoop;
          const outOpt=()=>({max:240,temp:+$('#tp').value||.7,topk:+$('#tk').value||20});
          $('#pb').onclick=async()=>{
           if(busy)return;busy=true;$('#pt').textContent='…';
           const o=await generate(M,[1,...enc.encode('Hallo'),2],outOpt(),null,yieldUI);
           $('#pt').textContent='Nutzer: Hallo\nFlora: '+dec.decode(Uint8Array.from(o));busy=false;
          };

          /* ---------- Chat ---------- */
          const log=$('#log');
          function bubble(cls,txt){const d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
          async function send(){
           const q=$('#in').value.trim();if(!q||busy)return;
           $('#in').value='';busy=true;bubble('me',q);const b=bubble('fl','…');$('#orb').classList.add('think');
           const T=M.cfg.T;let p=[];
           for(const h of conv.slice(-3))p.push(1,...enc.encode(h.q),2,...enc.encode(h.a),3);
           p.push(1,...enc.encode(q),2);
           if(p.length>T-48){p=p.slice(-(T-48));const k=p.indexOf(1);if(k>0)p=p.slice(k)}
           const bytes=[];let t0=performance.now();
           const o=await generate(M,p,outOpt(),id=>{bytes.push(id);if(bytes.length%6===0){b.textContent=dec.decode(Uint8Array.from(bytes));log.scrollTop=log.scrollHeight}},yieldUI);
           const a=dec.decode(Uint8Array.from(o))||'(keine Antwort)';b.textContent=a;
           const m=document.createElement('span');m.className='meta';m.textContent=o.length+' Zeichen · '+(o.length/((performance.now()-t0)/1000)).toFixed(0)+' Zeichen/s · Modell nach '+M.step+' Schritten';b.appendChild(m);
           conv.push({q,a});$('#orb').classList.remove('think');busy=false;log.scrollTop=log.scrollHeight;
          }
          $('#send').onclick=send;$('#in').onkeydown=e=>{if(e.key==='Enter')send()};

          /* ---------- Modell ---------- */
          function head(){$('#sub').textContent=fmt(nParams(M.cfg))+' Parameter · '+M.step+' Trainingsschritte'}
          function mstats(){
           const c=M.cfg,last=M.hist.length?M.hist[M.hist.length-1]:null;
           const it=[[fmt(nParams(c)),'Parameter'],[M.step,'Schritte'],[c.L+' × '+c.H,'Schichten × Köpfe'],[c.d,'Breite'],[c.T,'Kontext (Zeichen)'],[last==null?'–':last.toFixed(2),'Verlust']];
           $('#mstats').innerHTML=it.map(i=>'<div class="card stat" style="margin:0"><b>'+i[0]+'</b><small>'+i[1]+'</small></div>').join('');
          }
          $('#nm').onclick=async()=>{
           if(busy||training||!confirm('Aktuelles Modell löschen und ein neues, untrainiertes erstellen?'))return;
           M=newModel(PRESETS[$('#ps').value]);await saveModel();head();mstats();chart();conv=[];toast('Neues Modell erstellt');
          };
          $('#dl').onclick=async()=>{
           if(busy)return;const s=exportModel(M),P=window.Capacitor&&window.Capacitor.Plugins;
           try{
            if(P&&P.Filesystem&&P.Share){
             await P.Filesystem.writeFile({path:'flora-gpt.json',data:s,directory:'CACHE',encoding:'utf8'});
             const u=await P.Filesystem.getUri({path:'flora-gpt.json',directory:'CACHE'});
             await P.Share.share({title:'Flora GPT Modell',url:u.uri});return;
            }
           }catch(e){}
           const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='flora-gpt.json';a.click();
          };
          $('#imp').onclick=()=>$('#fm').click();
          $('#fm').onchange=async e=>{
           const f=e.target.files[0];e.target.value='';if(!f||busy||training)return;
           try{M=importModel(await f.text());await saveModel();head();mstats();chart();toast('Modell importiert ✓')}catch(x){toast('Keine gültige Flora-GPT-Datei')}
          };
          function tab(n){
           document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+n));
           document.querySelectorAll('nav div').forEach(e=>e.classList.toggle('on',e.dataset.t===n));
           if(n==='model')mstats();if(n==='data')dstats();if(n==='train')chart();
          }
          document.querySelectorAll('nav div').forEach(e=>e.onclick=()=>tab(e.dataset.t));

          async function boot(){
           try{const o=await idbGet('gpt');if(o)M=restore(o)}catch(e){}
           try{const d=await idbGet('data');if(d)DS=d}catch(e){}
           if(!M)M=newModel(PRESETS.klein);
           $('#boot').style.display='none';head();dstats();mstats();
           bubble('fl',M.step?'Hi, ich bin Flora. Schreib mir etwas!':'Hi! Ich bin Flora, ein echtes GPT-Modell, aber noch ohne Training. Füge im Tab Daten Texte hinzu und starte das Training, danach kann ich antworten.');
          }
          boot();
          </script></body></html>
          EOF

      - name: Capacitor-Android-Projekt erzeugen
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Flora GPT" com.flora.ai --web-dir=www
          npx cap add android
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Flora-GPT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
